<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lousa — agents draw here</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="topbar">
  <div id="brand">
    <a href="/" id="galleryLink" title="Back to the gallery">🖊️ <strong>Lousa</strong></a>
    <span id="boardTitle"></span>
    <span id="status" class="idle">ready</span>
  </div>
  <div id="controls">
    <button id="fitBtn" title="Fit drawing to view">Fit</button>
    <button id="exportBtn" title="Export PNG">PNG</button>
  </div>
</header>

<main id="board">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg">
    <g id="world"></g>
    <g id="overlay"></g>
  </svg>
  <div id="narration" hidden></div>
  <div id="toast" hidden></div>
</main>

<script src="/vendor/rough.js"></script>
<script src="/app.js"></script>
</body>
</html>
